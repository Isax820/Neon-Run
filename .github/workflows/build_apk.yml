name: Build APK

on:
  # Lancement manuel depuis l'onglet "Actions" sur GitHub
  workflow_dispatch:
  # Lancement automatique a chaque push touchant le dossier Android ou les assets
  push:
    paths:
      - 'src/android/**'
      - 'assets/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4

      - name: Build APK avec l'image officielle Buildozer
        uses: addnab/docker-run-action@v3
        with:
          image: kivy/buildozer:latest
          # On monte TOUT le repo (pas juste src/android), pour que
          # assets/ (a la racine) soit aussi visible dans le conteneur.
          options: -v ${{ github.workspace }}:/home/user/hostcwd
          run: |
            cd /home/user/hostcwd/src/android

            # Buildozer exige un point d'entree nomme exactement main.py
            # -> copie temporaire depuis main_android.py, uniquement
            #    dans le conteneur de build (ne touche pas le repo)
            cp main_android.py main.py

            # "yes |" repond automatiquement aux prompts interactifs
            # de Buildozer (avertissement root, licences SDK, etc.)
            yes | buildozer android debug

      - name: Upload de l'APK genere
        uses: actions/upload-artifact@v4
        with:
          name: neon-run-apk
          path: src/android/bin/*.apk
