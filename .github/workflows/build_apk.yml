name: Build APK - v1.0

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/android/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build APK with official Buildozer image
        uses: addnab/docker-run-action@v3
        with:
          image: kivy/buildozer:latest
          options: -v ${{ github.workspace }}/android:/home/user/hostcwd
          run: |
            cd /home/user/hostcwd
            buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: neon-run-apk
          path: android/bin/*.apk
